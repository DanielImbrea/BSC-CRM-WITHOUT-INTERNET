name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instaleaza dependentele
        run: npm ci

      - name: Genereaza clientul Prisma
        run: npx prisma generate

      - name: Build renderer si Electron
        run: npm run build:renderer

      - name: Verifica artefactele de build
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist-electron/main/index.js
          test -f dist-electron/preload/index.cjs
          test -d node_modules/prisma-client
          test -d node_modules/@prisma/engines

      - name: Build si pachetare Electron
        run: npx electron-builder --win --x64 --publish never

      - name: Verifica Prisma in pachet
        shell: bash
        run: |
          npx asar list release/win-unpacked/resources/app.asar | grep -E "prisma-client|@prisma/engines" | head -5
          ls release/win-unpacked/resources/app.asar.unpacked/node_modules/prisma-client/ | grep -E "node|dll"

      - name: Incarca instalatorul Windows
        uses: actions/upload-artifact@v4
        with:
          name: lab-manager-windows-latest
          path: release/*.exe

  build-macos:
    name: build (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instaleaza dependentele
        run: npm ci

      - name: Genereaza clientul Prisma
        run: npx prisma generate

      - name: Build renderer si Electron
        run: npm run build:renderer

      - name: Build si pachetare Electron
        run: npx electron-builder --mac --publish never

      - name: Incarca instalatorul macOS
        uses: actions/upload-artifact@v4
        with:
          name: lab-manager-macos-latest
          path: release/*.zip
