name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instaleaza dependentele
        run: npm ci

      - name: Genereaza clientul Prisma
        run: npx prisma generate

      - name: Build renderer si Electron
        run: npm run build:renderer

      - name: Verifica artefactele de build
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist-electron/main/index.js
          test -f dist-electron/preload/index.cjs
          test -d node_modules/prisma-client
          test -d node_modules/@prisma/engines

      - name: Build si pachetare Electron (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never

      - name: Verifica Prisma in pachet (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx asar list release/win-unpacked/resources/app.asar | grep -E "prisma-client|@prisma/engines" | head -5
          ls release/win-unpacked/resources/app.asar.unpacked/node_modules/prisma-client/ | grep -E "node|dll"

      - name: Build si pachetare Electron (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Incarca instalatorul rezultat
        uses: actions/upload-artifact@v4
        with:
          name: lab-manager-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
