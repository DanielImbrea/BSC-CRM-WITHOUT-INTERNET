appId: com.labmanager.app
productName: Billionaire Smile Club CRM
directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - prisma/**
  - node_modules/@prisma/**/*
  - from: node_modules/prisma-client
    to: node_modules/prisma-client
    filter:
      - "**/*"

extraResources:
  - from: prisma
    to: prisma

# Prisma query engine e binar nativ — trebuie inclus explicit pentru fiecare platformă.
asarUnpack:
  - "**/node_modules/@prisma/engines/**"
  - "**/node_modules/prisma-client/**"
  - "**/node_modules/prisma/**"

mac:
  target: zip
  category: public.app-category.business
  hardenedRuntime: false

win:
  target: nsis
  executableName: BSC-CRM

linux:
  target: AppImage
  category: Office
