appId: com.labmanager.app
productName: Billionaire Smile Club CRM
directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - prisma/**

extraResources:
  - from: prisma
    to: prisma

# Prisma query engine e binar nativ — trebuie inclus explicit pentru fiecare platformă.
asarUnpack:
  - "**/node_modules/@prisma/engines/**"
  - "**/node_modules/.prisma/client/**"

mac:
  target: zip
  category: public.app-category.business
  hardenedRuntime: false

win:
  target: nsis
  executableName: BSC-CRM

linux:
  target: AppImage
  category: Office
