appId: com.labmanager.app
productName: Billionaire Smile Club CRM
directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - prisma/**
  - node_modules/@prisma/**/*
  - from: node_modules/prisma-client
    to: node_modules/prisma-client
    filter:
      - "**/*"
  - from: node_modules/@prisma/engines
    to: node_modules/@prisma/engines
    filter:
      - "**/*"

extraResources:
  - from: prisma
    to: prisma

# Binarele native (Prisma query/schema engine) nu pot rula din interiorul app.asar.
asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/node_modules/@prisma/engines/**"
  - "**/node_modules/prisma-client/**"

mac:
  target: zip
  category: public.app-category.business
  hardenedRuntime: false

win:
  target: nsis
  executableName: BSC-CRM
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Billionaire Smile Club CRM
  artifactName: BSC-CRM-Setup-${version}.${ext}
  # Păstrează baza de date din AppData la dezinstalare.
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Billionaire Smile Club CRM

linux:
  target: AppImage
  category: Office
